<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catchly panel</title>
<style>
  body{margin:0;font:15px system-ui,sans-serif;background:#faf7f2;color:#222}
  main{max-width:720px;margin:0 auto;padding:16px}
  h1{margin:8px 0 16px;font-size:22px}
  h2{margin:24px 0 8px;font-size:17px}
  .card{background:#fff;border:1px solid #e8e2d9;border-radius:12px;padding:14px;margin-bottom:12px}
  input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 10px;border:1px solid #ccc;border-radius:8px;font:inherit}
  textarea{min-height:110px}
  button,.btn{display:inline-block;border:0;border-radius:8px;padding:9px 14px;margin:2px 4px 2px 0;background:#f97316;color:#fff;font:600 14px system-ui,sans-serif;text-decoration:none;cursor:pointer}
  button.alt{background:#555}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{background:#fff;border:1px solid #e8e2d9;border-radius:12px;padding:12px}
  .stat b{display:block;font-size:24px}
  .muted{color:#777;font-size:13px}
  .msg{margin:8px 0;color:#b45309}
</style>
</head>
<body>
<main>
  <h1>Catchly</h1>
  <div id="msg" class="msg"></div>

  <section id="login" class="card">
    <label>Business ID<input id="biz" autocomplete="off"></label>
    <label>API key<input id="key" type="password" autocomplete="off"></label>
    <button id="open">Open panel</button>
  </section>

  <section id="app" hidden>
    <div id="stats" class="stats"></div>

    <h2>Follow-ups</h2>
    <div class="card">
      <button id="run">Get due follow-ups</button>
      <div class="muted">Each message opens WhatsApp with the text ready. You tap send.</div>
      <div id="due"></div>
    </div>

    <h2>Leads</h2>
    <div id="leads"></div>

    <h2>Add a document</h2>
    <div class="card">
      <label>Title<input id="dtitle" maxlength="200"></label>
      <label>Text (fees, timings, FAQs)<textarea id="dtext"></textarea></label>
      <button id="upload">Save document</button>
    </div>

    <button id="refresh" class="alt">Refresh</button>
    <button id="logout" class="alt">Log out</button>
  </section>
</main>

<script>
var $ = function (id) { return document.getElementById(id); };
var state = {
  business: sessionStorage.getItem("ctl_b") || "",
  key: sessionStorage.getItem("ctl_k") || ""
};

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function show(msg) { $("msg").textContent = msg || ""; }

function api(path, options) {
  options = options || {};
  options.headers = Object.assign({ "X-API-Key": state.key }, options.headers || {});
  return fetch(path, options).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (r.status === 401) {
        logout("Wrong business ID or API key.");
        throw new Error("auth");
      }
      if (!r.ok) {
        throw new Error(typeof d.detail === "string" ? d.detail : "Request failed (" + r.status + ")");
      }
      return d;
    });
  });
}

function logout(msg) {
  sessionStorage.clear();
  state = { business: "", key: "" };
  $("app").hidden = true;
  $("login").hidden = false;
  show(msg || "");
}

function enter() {
  $("login").hidden = true;
  $("app").hidden = false;
  show("");
  load();
}

function load() {
  var q = "?business_id=" + encodeURIComponent(state.business);
  return Promise.all([api("/dashboard" + q), api("/leads" + q)]).then(function (res) {
    renderStats(res[0]);
    renderLeads(res[1].leads);
  }).catch(function (e) { if (e.message !== "auth") show(e.message); });
}

function renderStats(d) {
  var items = [
    ["New leads", d.leads["new"]], ["Replied", d.leads.replied],
    ["Converted", d.leads.converted], ["Lost", d.leads.lost],
    ["Follow-ups pending", d.followups.pending], ["Follow-ups sent", d.followups.sent],
    ["Documents", d.documents]
  ];
  var box = $("stats");
  box.textContent = "";
  items.forEach(function (it) {
    var s = el("div", "stat");
    s.appendChild(el("b", "", String(it[1])));
    s.appendChild(el("span", "muted", it[0]));
    box.appendChild(s);
  });
}

function setStatus(id, status) {
  api("/leads/" + id, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ business_id: state.business, status: status })
  }).then(load).catch(function (e) { if (e.message !== "auth") show(e.message); });
}

function renderLeads(list) {
  var box = $("leads");
  box.textContent = "";
  if (!list.length) { box.appendChild(el("div", "muted", "No leads yet.")); return; }
  list.forEach(function (l) {
    var c = el("div", "card");
    c.appendChild(el("b", "", l.name + "  (" + l.status + ")"));
    c.appendChild(el("div", "", l.phone));
    if (l.interest) c.appendChild(el("div", "muted", "Asked: " + l.interest));
    if (l.status === "new") {
      [["Replied", "replied"], ["Converted", "converted"], ["Lost", "lost"]].forEach(function (b) {
        var btn = el("button", "alt", b[0]);
        btn.addEventListener("click", function () { setStatus(l.id, b[1]); });
        c.appendChild(btn);
      });
    }
    box.appendChild(c);
  });
}

function waLink(phone, message) {
  var digits = phone.replace(/\D/g, "");
  if (digits.length === 10) digits = "91" + digits;
  return "https://wa.me/" + digits + "?text=" + encodeURIComponent(message);
}

$("run").addEventListener("click", function () {
  api("/followups/run?business_id=" + encodeURIComponent(state.business), { method: "POST" })
    .then(function (d) {
      var box = $("due");
      box.textContent = "";
      if (!d.count) { box.appendChild(el("div", "muted", "Nothing is due right now.")); return load(); }
      d.messages.forEach(function (m) {
        var c = el("div", "card");
        c.appendChild(el("b", "", m.name + "  " + m.phone));
        c.appendChild(el("div", "", m.message));
        var a = el("a", "btn", "Open WhatsApp");
        a.href = waLink(m.phone, m.message);
        a.target = "_blank";
        a.rel = "noopener";
        c.appendChild(a);
        box.appendChild(c);
      });
      return load();
    }).catch(function (e) { if (e.message !== "auth") show(e.message); });
});

$("upload").addEventListener("click", function () {
  var title = $("dtitle").value.trim();
  var text = $("dtext").value.trim();
  if (!title || !text) { show("Add a title and some text."); return; }
  api("/documents", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ business_id: state.business, title: title, text: text })
  }).then(function (d) {
    $("dtitle").value = "";
    $("dtext").value = "";
    show("Saved (" + d.chunks + " parts).");
    return load();
  }).catch(function (e) { if (e.message !== "auth") show(e.message); });
});

$("open").addEventListener("click", function () {
  state.business = $("biz").value.trim();
  state.key = $("key").value.trim();
  if (!state.business || !state.key) { show("Enter both fields."); return; }
  sessionStorage.setItem("ctl_b", state.business);
  sessionStorage.setItem("ctl_k", state.key);
  enter();
});
$("refresh").addEventListener("click", load);
$("logout").addEventListener("click", function () { logout(""); });

if (state.business && state.key) enter();
</script>
</body>
</html>
