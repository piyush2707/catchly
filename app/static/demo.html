<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catchly widget demo</title>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<h1>Widget demo</h1>
<p id="note">Add ?b=YOUR_BUSINESS_ID to the address to try the widget.</p>
<script>
var b = new URLSearchParams(location.search).get("b");
if (b) {
  document.getElementById("note").textContent = "Widget loaded for " + b + ". Look at the bottom right.";
  var s = document.createElement("script");
  s.src = "/widget.js";
  s.setAttribute("data-business", b);
  document.body.appendChild(s);
}
</script>
</body>
</html>
